[project]
name = "thoughtlink"
version = "1.0.0"
description = "ThoughtLink: Brain-to-Robot intent decoding using non-invasive EEG/NIRS signals"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "mne>=1.6",
    "torch>=2.2",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.30",
    "huggingface-hub>=0.20",
    "datasets>=2.16",
    "pyyaml>=6.0",
    "PyWavelets>=1.5",
    "pytest>=8.0",
    "pandas>=2.1",
    "skl2onnx>=0.7",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
sim = [
    "mujoco>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/thoughtlink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# PyTorch CUDA 12.8 wheels are multi-architecture fat binaries (SASS for
# Ampere/Ada/Hopper/Blackwell + PTX for forward-compat), so a single torch
# build runs on RTX 30xx/40xx/50xx and datacenter GPUs as long as the host
# driver is recent enough. Required for Blackwell (RTX 50-series, sm_120),
# which the default PyPI / cu124 wheels do not cover. Linux-only marker so
# macOS contributors still get the standard PyPI build (no CUDA on macOS).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
