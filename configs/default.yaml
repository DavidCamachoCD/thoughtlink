# ThoughtLink - Default Configuration

data:
  dataset_id: "KernelCo/robot_control"
  cache_dir: "./data/raw"
  test_size: 0.2  # fraction of subjects for test (legacy 2-way)
  # 3-way split for calibration + conformal (with 17 subjects: 13/1/3)
  split_3way:
    calib_size: 0.0588   # 1/17
    test_size: 0.1765    # 3/17

preprocessing:
  eeg:
    sfreq: 500.0
    channels: ["AFF6", "AFp2", "AFp1", "AFF5", "FCz", "CPz"]
    bandpass_low: 1.0
    bandpass_high: 40.0
    reference: "average"  # CAR
  nirs:
    sfreq: 4.76
    n_modules: 40
    sds_indices: [1, 2]  # medium + long
    n_pca_components: 20
  stimulus_onset_s: 3.0
  window_duration_s: 1.0
  window_stride_s: 0.5
  max_stimulus_s: 8.0

features:
  bands:
    theta: [4, 8]
    mu: [8, 13]
    beta: [13, 30]
    low_gamma: [30, 40]
  csp_n_components: 4
  hjorth: true
  wavelet:
    enabled: false  # Set to true in train_wavelet.py for wavelet-based training
    family: "db4"
    levels: [3, 4, 5]
    include_approx: true
    stats: ["energy", "entropy", "std"]

models:
  hierarchical:
    stage1_threshold: 0.5  # Relax vs Active
    stage2_model: "svm_rbf"
  baseline:
    logreg_C: 1.0
    svm_C: 10.0
    svm_kernel: "rbf"
    rf_n_estimators: 200
    rf_max_depth: 10

inference:
  confidence_threshold: 0.6
  hysteresis_margin: 0.1
  debounce_count: 3
  smoother_window: 5
  prediction_hz: 2.0

# Post-hoc confidence calibration (Platt 1999 / Zadrozny & Elkan 2002 / Guo et al. 2017).
# Default sigmoid (Platt) since our calibration set is small (~1 subject =
# ~700 windows) and Niculescu-Mizil & Caruana 2005 show isotonic only beats
# sigmoid past ~1k calibration examples. CNN/temporal models use temperature
# scaling regardless (Guo et al. 2017).
calibration:
  enabled: true
  sklearn_method: "sigmoid"    # or "isotonic" (use only if calib > 1k samples)

# Split-conformal prediction (Vovk 2005; Romano et al. 2020). Provides a
# distribution-free coverage guarantee >= 1 - alpha. When the prediction set
# has more than one class, BrainPolicy holds the previous action.
conformal:
  enabled: true
  alpha: 0.1                   # 90% target coverage
  score: "aps"                 # "aps" (Romano et al. 2020) or "naive"

bridge:
  intent_to_action:
    Right Fist: "RIGHT"
    Left Fist: "LEFT"
    Both Fists: "FORWARD"
    Tongue Tapping: "STOP"
    Relax: "STOP"
  controller:
    backend: "sim"
    hold_s: 0.3
    forward_speed: 0.6
    yaw_rate: 0.8
    smooth_alpha: 0.3
